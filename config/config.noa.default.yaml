noa_options:
- id: AENC
  grouped_name: AENC_ATNC
  name: "A new 400 kV double circuit in north East Anglia"
    # detailed description
  description: "Construct a new 400 kV double circuit in north East Anglia to facilitate power transfer requirements across the relevant boundaries. Substation works are required to accommodate the new circuits."
  commissioning_year: 2027
    # details of individual components to change
  details:
  - name: 60km of new 400kV double circuit OHL between Norwich Main and Bramford substations.
    pypsa_operations:
    - action: add
      component_type: substation
      name: Norwich Main Substation     # OSM name
      voltage: 400     # provide voltage level in KV (TODO: do we need to define AC or DC?)
      carrier: AC
    - action: add     # TODO: think if we need to make addition of several substations in one action
      component_type: substation
      name: Bramford Substation
      voltage: 400
      carrier: AC
    - action: add
      component_type: line
      name: AENC_400kV_OHL_NorwichMain_Bramford
      from: Norwich Main Substation # TODO: maybe we call it fully from_substation and to_substation
      to: Bramford Substation
      voltage: 400
      length_km: 60
      circuits: 2
      carrier: AC # probably not needed, because it is AC for lines by default
- id: BBNC
  grouped_name: BBNC_BPNC
  name: "TBD"
  description: "TBD"
  commissioning_year: 2027
  # details of individual components to change
  details:
  - name: "new 400kV substations at Beauly, Blackhillock, New Deer"
    pypsa_operations:
    - action: add
      component_type: substation
      name: "Beauly"     # OSM name
      voltage: 400     # provide voltage level in KV (TODO: do we need to define AC or DC?)
      carrier: AC
  - name: "new 400kV substations at Peterhead"
    pypsa_operations:
    - action: add
      component_type: substation
      name: "Bramford Substation"
      voltage: 400
      carrier: AC
  - name: "new 400kV substation at Peterhead"
    pypsa_operations:
    - action: add
      component_type: substation
      name: "Peterhead Substation"
      voltage: 400
      carrier: AC
  - name: "new 132kV substation at Peterhead"
    pypsa_operations:
    - action: add
      component_type: substation
      name: "Peterhead Substation"
      voltage: 132
      carrier: AC
  - name: "new 110km 400kV double circuit OHL between new Beauly 400kV substation and new Blackhillock 400kV substation"
    pypsa_operations:
    - action: add
      component_type: line
      name: "new 400kV DC OHL between Beauly and Blackhillock"
      from: Beauly-400
      to: Blackhillock-400
      voltage: 400
      length_km: 110
      circuits: 2
      carrier: AC # probably not needed, because it is AC for lines by default
    - action: add
      component_type: line
      name: "new 82km 400kV double circuit OHL between new Blackhillock and New Deer"
      from: Blackhillock-400
      to: New Deer-400
      voltage: 400
      length_km: 82
      circuits: 2
      carrier: AC # probably not needed, because it is AC for lines by default
    - action: add
      component_type: line
      name: "new 82km 400kV double circuit OHL between new New Deer and Peterhead"
      from: New Deer-400
      to: Peterhead-400
      voltage: 400
      length_km: 80
      circuits: 2
      carrier: AC # probably not needed, because it is AC for lines by default
