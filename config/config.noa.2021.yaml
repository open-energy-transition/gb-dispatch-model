noa_options:
- id: AENC
  grouped_name: AENC_ATNC
  name: A new 400 kV double circuit in north East Anglia
    # detailed description
  description: "Construct a new 400 kV double circuit in north East Anglia to facilitate power transfer requirements across the relevant boundaries. Substation works are required to accommodate the new circuits."
  commissioning_year: 2027
    # details of individual components to change
  details:
  - name: 60km of new 400kV double circuit OHL between Norwich Main and Bramford substations.
    pypsa_operations:
    - action: add
      component_type: substation
      names:
      - Norwich Main Substation
      - Bramford Substation
      voltage: 400     # provide voltage level in KV (TODO: do we need to define AC or DC?)
      carrier: AC
    - action: add
      component_type: line
      name: AENC_400kV_OHL_NorwichMain_Bramford
      from: Norwich Main Substation # TODO: maybe we call it fully from_substation and to_substation
      to: Bramford Substation
      voltage: 400
      length_km: 60
      circuits: 2
      carrier: AC # probably not needed, because it is AC for lines by default
  - name: 120km of new 400kV double circuit OHL between Bramford and Tilbury substations via a new connection substation to be located in the Tendring district
    pypsa_operations:
    - action: add
      component_type: substation
      names:
      - Tilbury Substation
      - Lawford Substation # new connection substation to be located in the Tendring district (based on provided map: https://norwichtotilburymap.nationalgrid.com/)
      voltage: 400
      carrier: AC
    - action: add
      component_type: line
      name: AENC_400kV_OHL_Bramford_Tendring_Lawford
      from: Bramford Substation
      to: Lawford Substation
      voltage: 400
      length_km: 60 # approximate assumption based on provided map
      circuits: 2
      carrier: AC
    - action: add
      component_type: line
      name: AENC_400kV_OHL_Tendring_Lawford_Tilbury
      from: Lawford Substation
      to: Tilbury Substation
      voltage: 400
      length_km: 60 # approximate assumption based on provided map
      circuits: 2
      carrier: AC

- id: BBNC
  grouped_name: BBNC_BPNC
  name: Beauly - Blackhillock 400 kV double circuit addition
  description: "Construct a new 400 kV double circuit between Beauly and Blackhillock. At both sites extend the 400 kV busbar arrangements to allow for the connection of two additional bays."
  commissioning_year: 2030
  # details of individual components to change
  details:
  - name: new 110km 400kV double circuit OHL between new Beauly 400kV substation and new Blackhillock 400kV substation
    pypsa_operations:
    - action: add
      component_type: substation
      names:
      - Beauly Substation
      - Blackhillock Substation
      voltage: 400
      carrier: AC
    - action: add
      component_type: line
      name: BBNC_400kV_OHL_Beauly_Blackhillock
      from: Beauly Substation
      to: Blackhillock Substation
      voltage: 400
      length_km: 110
      circuits: 2
      carrier: AC

- id: BDUP
  grouped_name: BDUP
  name: Beauly - Denny 275 kV circuit upgrade to 400 kV
  description: "Uprating of the 275 kV side of the existing Beauly-Denny circuit to 400 kV operation between SHE Transmission and SPT.  Substation works will be required at Beauly, Fasnakyle, Fort Augustus, Kinardochy, Braco West and Denny North. The Errochty I/T scheme (implemented under ECU2) shall be amended to trip the 400/132 kV supergrid transformer(SGTs) at Kinardochy under loss of the 400 kV double circuit south of Kinardochy."
  commissioning_year: 2030
  # details of individual components to change
  details:
  - name: upgrade line from 275 kV to 400 kV from Beauly to Denny
    pypsa_operations:
    - action: add
      component_type: substation
      names:
      - Beauly Substation
      - Fasnakyle Substation
      - Fort Augustus Substation
      - Kinardochy Substation
      - Braco West Substation
      - Denny Substation
      voltage: 400
      carrier: AC
    - action: update
      component_type: line
      name: BDUP_275kV_to_400kV_OHL_Beauly_Fasnakyle
      from: Beauly Substation
      to: Fasnakyle Substation
      from_voltage: 275
      to_voltage: 400
      circuits: 1
      carrier: AC
    - action: update
      component_type: line
      name: BDUP_275kV_to_400kV_OHL_Fasnakyle_FortAugustus
      from: Fasnakyle Substation
      to: Fort Augustus Substation
      from_voltage: 275
      to_voltage: 400
      circuits: 1
      carrier: AC
    - action: update
      component_type: line
      name: BDUP_275kV_to_400kV_OHL_FortAugustus_Kinardochy
      from: Fort Augustus Substation
      to: Kinardochy Substation
      from_voltage: 275
      to_voltage: 400
      circuits: 1
      carrier: AC
    - action: update
      component_type: line
      name: BDUP_275kV_to_400kV_OHL_Kinardochy_BracoWest
      from: Kinardochy Substation
      to: Braco West Substation
      from_voltage: 275
      to_voltage: 400
      circuits: 1
      carrier: AC
    - action: update
      component_type: line
      name: BDUP_275kV_to_400kV_OHL_BracoWest_Denny
      from: Braco West Substation
      to: Denny Substation
      from_voltage: 275
      to_voltage: 400
      circuits: 1
      carrier: AC

