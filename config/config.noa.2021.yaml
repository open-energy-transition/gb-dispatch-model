      circuits: 1
      carrier: AC

- id: CKPC
  name: Power control device along Creyke Beck to Keadby to Killingholme
  description: "Install a power control device along the Creyke Beck to Keadby to Killingholme 400 kV overhead line route. This would improve the capability to control the power flows from north to south of the transmission network."

- id: CLNC
  name: New Cumbria to Lancashire reinforcement
  description: "Construct a new 400 kV double circuit from north west England to Lancashire, to facilitate power transfer requirements across the relevant boundaries. Suitable connection points at each end will be identified, as well as relevant substation works required to accommodate the new circuit."

- id: CMNC
  name: South east Scotland to north west England AC onshore reinforcement
  description: "Construct a new 400 kV double circuit from in south east Scotland to north west England, to facilitate power transfer requirements across the relevant boundaries. Suitable connection points at each end will be identified, as well as relevant substation works required to accommodate the new circuit."

- id: CRPC
  name: Power control device along Cottam to West Burton
  description: "Install a power control device along the Cottom to Ryhall 400 kV overhead line route. This would improve the capability to control the power flows from north to south of the transmission network."

- id: CS05
  name: Commercial solution for Scotland and the North of England - stage 1
  description: "This ESO-led commercial solution provides benefit across boundaries B2 and B4 in the north of Scotland."

- id: CS06
  name: Commercial solution for Scotland and the North of England - stage 2
  description: "This ESO-led commercial solution provides benefit across boundaries B2 and B4 in the north of Scotland."

- id: CS07
  name: Commercial solution for East Anglia - stage 1
  description: "This ESO-led commercial solution provides boundary benefit across the East Anglia boundary."

- id: CS08
  name: Commercial solution for East Anglia - stage 2
  description: "This ESO-led commercial solution provides boundary benefit across the East Anglia boundary."

- id: CS11
  name: Commercial solution for the North of England - stage 1
  description: "This ESO-led commercial solution provides boundary benefit across the north of England."

- id: CS12
  name: Commercial solution for the North of England - stage 2
  description: "This ESO-led commercial solution provides boundary benefit across the north of England."

- id: CS20
  name: Commercial solution for North Wales - stage 1
  description: "This ESO-led commercial solution provides boundary benefit in the north of Wales."

- id: CS21
  name: Commercial solution for North Wales - stage 2
  description: "This ESO-led commercial solution provides boundary benefit in the north of Wales."

- id: CTP2
  name: Alternative power control device along Creyke Beck to Thornton
  description: "Install an alternative power control device along the Creyke Beck to Thornton 400 kV overhead line route. This would improve the capability to control the power flows from north to south of the transmission network."

- id: CTRE
  name: Reconductor remainder of Coryton South to Tilbury circuit
  description: "Replace the conductors on the remaining sections of the Coryton South to Tilbury circuit, which have not recently been reconductored with higher-rated conductors. These would increase the circuit’s thermal rating."

- id: CVUP
  name: Clydesmill to Strathaven 400 kV reinforcement
  description: "Following LWUP or DWUP, reconfigure and reconductor the 275 kV circuits between Clydesmill and Strathaven to establish a 400 kV single circuit, including substation works at Clydesmill and Strathaven.  The new circuit connects the new 400 kV circuit into Clydesmill into the existing 400 kV east-west corridor improving power flows."

- id: CWPC
  name: Power control device along Cottam to West Burton
  description: "Install a power control device along the Cottam to West Burton 400 kV overhead line route. This would improve the capability to control the power flows from north to south of the transmission network."

- id: DBNC
  name: Beauly to Dounreay 400 kV double circuit addition
  description: "Establish a new 400 kV double busbar substation at Loch Buidhe and Dounreay, and a new 400 kV double circuit overhead line between Beauly, Loch Buidhe and Dounreay (minimum summer pre-fault rating of 2083 MVA - Twin Araucaria at 90°C."

- id: DEP1
  name: Additional power control devices along the Drax - Eggborough 1 400 kV circuit
  description: "Install additional power control devices along the Drax to Eggborough 1 400 kV circuit.  This is to help balance the flows and alleviate overloading of circuit due to system faults."

- id: DEPC
  name: Power control device along Drax to Eggborough
  description: "Install a power control device along the Drax to Eggborough 400 kV overhead line route. This would improve the capability to control the power flows from north to south of the transmission network."

- id: DFRE
  name: Reconductor Drax to Fenwick Tee 400 kV circuit
  description: "The existing on Drax - Fenwick Tee (A344) circuit comprises 4 x 400mm² Quad Zebra 400 kV overhead lines on L6 circuit towers. This limits the rating of the circuit to 2671 MVA/3180 MVA (pre/post fault)."

- id: DLNC
  name: Loch Buidhe to Dounreay 400 kV reinforcement
  description: "Establish a new 400 kV double busbar substation at Loch Buidhe, Gordonbush, Strathbrora, Connagil and the existing Dounreay substation, rebuild Loch Buidhe to Dounreay double circuit overhead line for 400 kV operation (minimum summer pre-fault rating of 2083 MVA - Twin Araucaria at 90°C)"

- id: DLRE
  name: Loch Buidhe - Dounreay 275 kV double circuit overhead line reconductoring
  description: "Reconductor the Loch Buidhe to Dounreay 275 kV double circuit overhead line with a high temperature low sag conductor. This option is conditional on SHE Transmission business approval for the use of a high temperature conductor on the 275 kV network and suitability of the conductor for use on the existing L3 tower structures."

- id: DLUP
  name: Windyhill-Lambhill-Denny North 400 kV reinforcement
  description: "Following WLTI and DNEU, increase the operating voltage of the Windyhill to Lambhill to Denny 275 kV circuit by the establishment of a new 400 kV gas insulated substation at Windyhill, the installation of a new 400/275 kV transformer at Windyhill 400 kV substation, a new 400/275 kV transformer at Lambhill substation and transferring existing 275 kV circuit onto the existing Denny 400 kV substation."

- id: DNEU
  name: Denny North 400/275 kV second supergrid transformer
  description: "Installation of a new 400/275 kV 1000  MVA supergrid transformer (SGT2) at Denny North 400 kV substation."

- id: DREU
  name: Generator circuit breaker replacement to allow Thornton to run a two-way split
  description: "This reinforcement is to replace generator owned circuit breakers with higher-rated equivalents including substation equipment. This would allow higher fault levels, which in turn improves load sharing on circuits connecting to the substation."

- id: DWNO
  name: Denny to Wishaw 400 kV reinforcement
  description: "Construct a new 400 kV double circuit from Bonnybridge to Newarthill, and reconfigure associated sites to establish a fourth north to south double circuit supergrid route through the Scottish central belt. One side of the new double circuit will operate at 400 kV, the other at 275 kV. This reinforcement will establish Denny to Bonnybridge, Bonnybridge to Wishaw, Wishaw to Strathaven No.2 and Wishaw to Torness 400 kV circuits, and a Denny to Newarthill to Easterhouse 275 kV circuit."

- id: DWUP
  name: Kincardine - Wishaw 400 kV reinforcement
  description: "Establish a new 400 kV single circuit between Denny North, Clydesmill and Wishaw by reconfiguration of the existing Longannet to Easterhouse/Clydesmill 275 kV circuits and existing de-energised circuit between Easterhouse and Newarthill and the existing Newarthill to Wishaw circuit. Provides additional capability in Scotland via a new 400 kV corridor."

- id: E2DC
  name: Eastern subsea HVDC link from Torness to Hawthorn Pit
  description: "Construct a new offshore 2 GW HVDC subsea link from the Torness area to Hawthorn Pit to provide additional transmission capacity. The onshore works involve the construction of AC/DC converter stations and the associated AC works at Torness and Hawthorn Pit."
  commissioning_year: 2029
  # details of individual components to change
  details:
  - name: new DC line with 525kV from Torness in Southeast Scotland to Hawthorn Pit substation in Murton, County Durham.
    pypsa_operations:
    - action: add
      component_type: substation
      names:
      - Torness Substation
      - Hawthorn Pit Substation
      voltage: 525
      carrier: DC
    - action: add
      component_type: link # subsea cable
      name: E2DC_525kV_subsea_Torness_HawthornPit
      from: Torness Substation
      to: Hawthorn Pit Substation
      voltage: 525
      capacity: 2000 # MW
      length: 196 # km
      carrier: DC

- id: E4D3
  name: "Eastern Scotland to England link: Peterhead to Drax offshore HVDC"
  description: "Construct a new offshore 2 GW bipole HVDC subsea link from Peterhead in the north east of Scotland to Drax in the Yorkshire area of England. The onshore works involve the construction of AC/DC converter stations and the associated AC works at Peterhead and Drax."
  commissioning_year: 2029
  # details of individual components to change
  details:
  - name: new c505km from Sandford Bay, at Peterhead in Scotland, to the Drax Power Station in Yorkshire, England
    pypsa_operations:
    - action: add
      component_type: substation
      names:
      - Peterhead Substation
      - Drax
      voltage: 525
      carrier: DC
    - action: add
      component_type: link # subsea cable
      name: E4D3_525kV_subsea_Peterhead_Drax
