- id: TLNO
  name: Torness to north east England AC onshore reinforcement
  description: "This option provides additional transmission capacity by installing a new 400 kV double circuit from a 400 kV substation in the Torness area to a suitable connection point in north east England, including required additional substation equipment at both ends."

- id: TMPC
  name: Power control device along Thorpe Marsh to West Melton number 1 circuit
  description: "Install additional power control devices along the Thorpe Marsh to West Melton number 1 275 kV overhead line circuit. This would improve the capability to control the power flows from north to south of the transmission network."

- id: VERE
  name: Strathaven - Elvanfoot overhead line conductor replacement
  description: "Reconductor existing 400 kV double circuit overhead line route from Strathaven to Elvanfoot (total route length 49km) on existing towers and where required carry out all necessary foundation and steel works to repair towers for re-use."

- id: VSRE
  name: Strathaven - Smeaton overhead line conductor replacement
  description: "Reconductor existing 400 kV double circuit overhead line route from Strathaven to Wishaw and Wishaw to Smeaton on existing towers to a higher rated conductor system and where required carry out all necessary foundation and steel works to repair towers for re-use."

- id: WAM1
  name: 225 MVAr MSCs at Walpole
  description: "One new 225 MVAr switched capacitor (MSC) at Walpole would provide voltage support to the north London area as system flows increase in future."

- id: WAM2
  name: 225 MVAr MSCs at Walpole
  description: "One new 225 MVAr switched capacitor (MSC) at Walpole would provide voltage support to the north London area as system flows increase in future."

- id: WCC1
  name: Cable replacement at Hinksey
  description: "Upgrade the cable section in the Cowley to Walham 400 kV circuit at Hinksey to increasing the circuits' thermal ratings."

- id: WRRE
  name: Reconductor West Burton to Ratcliffe-on-Soar circuit
  description: "Replace the conductors in the West Burton to Ratcliffe-on-Soar circuit with higher-rated conductors to increase the circuit’s thermal ratings."

- id: WSEU
  name: Thermal upgrade for Sundon and Wymondley 400 kV substation
  description: "Upgrade the 400 kV Sundon and Wymondley substation equipment to increase its thermal capacity, supporting future load flow within the area."

- id: WYTI
  name: Wymondley turn-in
  description: "Modify the existing circuit that runs from Pelham to Sundon. Turn-in the circuit at Wymondley to create two separate circuits that run from Pelham to Wymondley and from Wymondley to Sundon to improve the balance of flows."
