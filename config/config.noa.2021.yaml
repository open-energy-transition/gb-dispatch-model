  # details of individual components to change
  details:
  - name: c90 km of new overhead line between the new Birkhill Wood and High Marnham 400 kV substations.
    pypsa_operations:
    - action: add
      component_type: substation
      names:
      - Creyke Beck Substation # Reference for new Birkhill Wood substation, because it is already located in Birkhill Wood
