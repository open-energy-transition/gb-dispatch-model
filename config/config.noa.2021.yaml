- id: TKP1
  name: Power control device along Tilbury to Kingsnorth
  description: "Install a power control device along the Tilbury to Kingsnorth 400 kV overhead line route. This would improve the capability to control the power flows in the south east region of the transmission network."

- id: TKRE
  name: Tilbury to Grain and Tilbury to Kingsnorth upgrade
  description: "Replace the conductors in the Tilbury to Grain and Tilbury to Kingsnorth circuits with higher-rated conductors, and replace the associated cables with larger cables of a higher rating, including Tilbury, Grain and Kingsnorth substation equipment. This will increase the circuits’ thermal ratings."

- id: TKU2
  name: Alternative East Coast onshore Phase 2 Reinforcement
  description: "Establish further 400 kV infrastructure on the east coast following ECUP.  Re-profile the existing Kintore to Tealing 275 kV double circuit to enable a higher operating temperature. Establish a new 400 kV substation at Tealing, including new 400/275 kV transformers. Re-insulate the existing Alyth to Tealing 275 kV double circuit overhead line for 400 kV operation. Reinsulate a single side of the existing 275 kV double circuit between Tealing and Longannet via Westfield to 400 kV operation, installing a new 400/275 kV transformer at Westfield."

- id: TKUP
  name: East Coast onshore 400 kV Phase 2 Reinforcement
  description: "Establish further 400 kV infrastructure on the east coast following ECUP. Rebuild the Kintore to Tealing 275 kV double circuit for 400 kV operation and establish a new 400 kV substation at Tealing, including new 400/275 kV transformers. Re-insulate the existing Alyth to Tealing 275 kV double circuit overhead line for 400 kV operation. Re-insulate the existing Tealing to Longannet 275 kV route through Glenrothes, Westfield and Mossmorran for 400 kV operation. Install 400/275 kV transformers at Glenrothes and new 400/132 kV transformers at Westfield and Mossmorran."
