- id: BLN2
  grouped_name: BLN2
  name: Beauly to Loch Buidhe 275 kV reinforcement
  description: "Replace the Beauly to Shin to Loch Buidhe 132 kV double circuit overhead line with a higher capacity 275 kV double circuit overhead line, including new transformers at Shin and substation extensions at Beauly and Loch Buidhe."
  commissioning_year: 2030
  # details of individual components to change
  details:
  - name: upgrade the Beauly to Shin to Loch Buidhe from 132 kV double circuit to 275 kV double circuit
    pypsa_operations:
    - action: add
      component_type: substation
      names:
      - Beauly Substation
      - Shin
      - Loch Buidhe Substation
      voltage: 275
      carrier: AC
    - action: update
      component_type: line
      name: BLN2_132kV_to_275kV_OHL_Beauly_Shin
      from: Beauly Substation
      to: Shin
      from_voltage: 132
      to_voltage: 275
      circuits: 2
      carrier: AC
    - action: update
      component_type: line
      name: BLN2_132kV_to_275kV_OHL_Shin_LochBuidhe
      from: Shin
      to: Loch Buidhe Substation
      from_voltage: 132
      to_voltage: 275
      circuits: 2
      carrier: AC

