      carrier: AC
    - action: update
      component_type: line
      name: CGNC_400kV_OHL_Brantingham_Broomfleet
      from: Brantingham
      to: Broomfleet
      voltage: 400
      circuits: 1
      carrier: AC
    - action: update
      component_type: line
      line_type: Al/St 240/40 4-bundle 380.0
      name: CGNC_400kV_OHL_Ealand_Keadby
      from: Ealand
      to: Keadby
