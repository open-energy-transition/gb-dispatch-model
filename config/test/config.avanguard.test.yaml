tutorial: false

run:
  name:
  #- "avanguard-test-sector-overnight-2030"
  - "avanguard-test-sector-overnight-2030-store"
  scenarios:
    enable: true
    file: config/test/scenarios.avanguard.test.yaml
  disable_progressbar: true
  shared_resources:
    policy: false


scenario:
  clusters:
  - "adm"
  sector_opts:
  - ''
  planning_horizons:
  - 2030

countries: ['BE']

electricity:

  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT, nuclear]
    StorageUnit: ["li-ion", lfp, vanadium, lair, pair]
    Store: [H2]
    Link: [H2 pipeline]

  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]

renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  mode: administrative
  administrative:
    level: 2 # NUTS2
  temporal:
    resolution_sector: 3h

sector:
  gas_network: true
  H2_retrofit: true
  hydrogen_turbine: false
  regional_oil_demand: false
  regional_co2_sequestration_potential:
    enable: false
  co2_spatial: false
  co2_network: false
  methanol:
    methanol_to_power:
      ocgt: false
    biomass_to_methanol: false
  ammonia: false
  biomass_spatial: false
  biomass_to_liquid: false
  electrobiofuels: false

solving:
  solver:
    name: gurobi
    options: gurobi-default

plotting:
  map:
    boundaries:
  eu_node_location:
    x: -5.5
    y: 46.
  costs_max: 1000
  costs_threshold: 0.0000001
  energy_max:
  energy_min:
  energy_threshold: 0.000001
